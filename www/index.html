<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edf6f5">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="兔狐">
<title>兔狐 · v56</title>
<link rel="icon" href="./assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./css/app.css">
<script defer src="./js/trip-data.js"></script>
<script defer src="./js/image-registry.js"></script>
<script defer src="./js/audio-data.js"></script>
<script defer src="./js/motion.js"></script>
<script defer src="./js/native-bridge.js"></script>
<script defer src="./js/assistant.js"></script>
<script defer src="./js/app.js"></script>
</head>
<body>
<main id="home" class="home" data-version="v56" data-layout="deck">
  <header class="home-header">
    <span class="date-rule" aria-hidden="true"></span>
    <button class="date-button" id="dateBtn" aria-label="选择日期"><strong id="dateText">10.03</strong><span id="dowText" class="dow-pill">SAT</span></button>
    <span class="date-rule" aria-hidden="true"></span>
    <button type="button" class="layout-toggle" id="layoutToggle" aria-label="切换到时间轴布局" aria-pressed="false"><span class="layout-icon" aria-hidden="true"><i></i><i></i><i></i></span></button>
  </header>
  <section id="homeStage" class="fn-stage" aria-label="当天行程；卡片模式上下滑动，时间轴模式直接浏览，左右切换日期">
    <ol id="timeline" class="fn-deck"></ol>
    <ol id="journeyList" class="journey-list" aria-label="当天行程时间轴"></ol>
  </section>
  <button type="button" class="home-position" data-a="feature" data-type="overview" aria-label="打开当天行程总览"><span id="positionText"></span><span id="positionBar" class="position-track"><i></i></span><span class="overview-label">总览</span></button>
  <nav id="bottomNav" class="bottom-nav" aria-label="旅行工具"></nav>
</main>
<dialog id="appDialog" class="app-dialog" aria-labelledby="dialogTitle"><header id="dialogHead" class="dialog-head"></header><div id="dialogBody" class="dialog-body" tabindex="-1"></div><footer id="dialogDock" class="dialog-dock"></footer></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="deckAnnouncement" class="sr-only" role="status" aria-live="polite"></div>
<noscript>请启用 JavaScript 后使用兔狐。</noscript>
</body>
</html>
