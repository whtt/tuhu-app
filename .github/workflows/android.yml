name: Android
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Verify source structure
        run: npm run check:source
      - name: Require runtime media bundle
        run: |
          test -d www/assets/audio
          test -d www/assets/photos
          test -d www/assets/generated
          npm run check:full
      - run: npm run android:prepare
      - name: Build installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TUHU-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error