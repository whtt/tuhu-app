name: Source Bundle
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source bundle
        run: |
          python3 - <<'PY'
          import os, zipfile
          skip={'.git','node_modules','android','ios','dist'}
          with zipfile.ZipFile('tuhu-v56-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk('.'):
                  dirs[:]=[d for d in dirs if d not in skip]
                  for f in files:
                      p=os.path.join(root,f)
                      if p.startswith('./tuhu-v56-source.zip'): continue
                      z.write(p,p[2:] if p.startswith('./') else p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tuhu-v56-source
          path: tuhu-v56-source.zip
          if-no-files-found: error
          retention-days: 7
